[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbafit"
version = "0.1.0"
description = "Encontrar el jugador NBA que mejor encaja en una plantilla, y a qué precio."
requires-python = ">=3.14"
dependencies = [
    "nba_api",
    "pandas",
    "numpy",
    "scikit-learn",
    "duckdb",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
